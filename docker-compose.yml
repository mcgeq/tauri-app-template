services:
  app:
    build: .
    ports:
      - '1420:1420'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/app/src-tauri/target
    environment:
      - TAURI_DEV_HOST=0.0.0.0

  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tauri_app_template
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
